<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Late Night Live: The RPG</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Courier+Prime:wght@400;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1020; --panel:#141a30; --ink:#f3ecd8; --muted:#9aa3c0;
  --gold:#ffcc4d; --red:#ff5a5f; --green:#4cd49a; --blue:#6cb8ff; --pink:#ff7ad9; --orange:#ff9442;
  --card:#fbf6e6; --cardink:#1d1a14;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}
body{background:radial-gradient(1200px 500px at 50% -200px,#2a2f6b 0%,transparent 70%),linear-gradient(#0b1020,#070a14);min-height:100vh}
.wrap{max-width:640px;margin:0 auto;padding:16px 14px 60px}
header{text-align:center;padding:8px 0 4px}
.onair{display:inline-block;font-family:Bungee;font-size:12px;letter-spacing:2px;color:#fff;background:var(--red);padding:3px 10px;border-radius:4px;box-shadow:0 0 14px rgba(255,90,95,.7);animation:pulse 2.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 4px rgba(255,90,95,.3);opacity:.85}}
h1{font-family:Bungee;font-weight:400;font-size:26px;margin:8px 0 2px;color:var(--gold);text-shadow:0 2px 0 #b3550a,0 0 18px rgba(255,204,77,.35);line-height:1.1}
.sub{color:var(--muted);font-size:13px}
.skyline{display:block;width:100%;height:46px;margin:8px 0 4px;opacity:.9}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;background:var(--panel);border:1px solid #232b4d;border-radius:12px;padding:12px;margin:10px 0 14px}
.stat label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:4px}
.stat label b{color:var(--ink);font-weight:700}
.stat.wide{grid-column:1/-1}
.bar{height:8px;background:#0a0f20;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;transition:width .5s ease}
.row{grid-column:1/-1;display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted);border-top:1px solid #232b4d;padding-top:8px}
.row b{color:var(--gold)}
.crew span b{color:var(--ink)}
.floors{display:flex;gap:4px;flex-wrap:wrap}
.fl{font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;background:#0a0f20;color:#5d6688;border:1px solid #232b4d}
.fl.on{background:var(--orange);color:#2a1200;border-color:var(--orange)}

.scene{background:var(--card);color:var(--cardink);border-radius:6px;padding:18px 18px 16px;box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 0 0 1px #e6dcc0;position:relative;animation:in .35s ease}
@keyframes in{from{transform:translateY(8px);opacity:0}}
.scene:before{content:"";position:absolute;inset:0;border-radius:6px;pointer-events:none;background:repeating-linear-gradient(transparent 0 27px,rgba(80,120,200,.10) 27px 28px)}
.kicker{font-family:Bungee;font-size:11px;letter-spacing:2px;color:#b3550a;margin-bottom:6px;position:relative}
.scene h2{font-family:"Courier Prime",monospace;font-size:22px;margin:0 0 10px;position:relative}
.scene p{font-family:"Courier Prime",monospace;font-size:16px;line-height:1.5;margin:0 0 12px;position:relative}
.scene p.q{font-style:italic;color:#5b4a2b}
.scene .say{font-family:"Courier Prime",monospace;font-size:15px;background:#efe5c8;border-left:4px solid #b3550a;padding:8px 10px;margin:0 0 10px;position:relative;border-radius:0 6px 6px 0}
.scene .say b{font-family:Inter;font-size:12px;display:block;color:#7a4a10;margin-bottom:2px}
.choices{display:flex;flex-direction:column;gap:10px;margin-top:14px;position:relative}
button.choice{all:unset;cursor:pointer;display:block;background:#1d2342;color:var(--ink);border-radius:10px;padding:12px 14px;border:1px solid #2f3866;transition:transform .08s,background .15s}
button.choice:hover{background:#262e57}
button.choice:active{transform:scale(.98)}
button.choice:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button.choice .t{font-weight:700;font-size:15px;display:block}
button.choice .d{font-size:13px;color:var(--muted);display:block;margin-top:3px;line-height:1.35}
button.choice.crewc{border-color:#8a5a20;background:#2a2238}
button.primary{background:var(--gold);color:#2a1a00;border-color:#d9a72c;text-align:center}
button.primary:hover{background:#ffd76e}
button.primary .t{color:#2a1a00}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px;position:relative}
.chip{font-family:Inter;font-size:12px;font-weight:700;padding:4px 8px;border-radius:999px;background:#eee3c4}
.chip.up{background:#d4f5e4;color:#0d6b43}
.chip.down{background:#ffe0e0;color:#a3151a}
.chip.claim{background:var(--orange);color:#2a1200}
input[type=text]{width:100%;font-family:"Courier Prime",monospace;font-size:18px;padding:10px 12px;border-radius:8px;border:2px solid #d7caa3;background:#fffdf5;color:#1d1a14;margin:4px 0 10px;position:relative}
.lbl{font-family:Inter;font-size:12px;font-weight:700;color:#7a6a45;position:relative}
.judges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 12px;position:relative}
.judge{background:#1d2342;color:var(--ink);border-radius:8px;text-align:center;padding:8px 4px}
.judge small{display:block;font-size:11px;color:var(--muted)}
.judge span{font-family:Bungee;font-size:28px;color:var(--gold)}
.meters{position:relative;margin:4px 0 10px;font-family:Inter;font-size:12px;font-weight:700}
.meters div{display:flex;align-items:center;gap:8px;margin:4px 0}
.meters em{font-style:normal;width:82px}
.meters .bar{flex:1;background:#e3d7b4}
.log{margin-top:18px;font-size:13px;color:var(--muted)}
.log summary{cursor:pointer;color:var(--ink)}
.log ol{padding-left:18px;line-height:1.6}
.foot{display:flex;justify-content:center;gap:16px;margin-top:16px}
.foot button{all:unset;cursor:pointer;color:var(--muted);font-size:12px;text-decoration:underline}
.copy{text-align:center;font-size:11px;color:#5d6688;margin-top:14px}
.paper{background:#f4ecd6;border:1px solid #cdbf98;padding:10px 12px;margin:0 0 12px;position:relative;font-family:Georgia,serif;color:#1d1a14;text-align:center}
.paper .mast{font-family:Georgia,serif;font-weight:700;font-size:18px;letter-spacing:2px;border-bottom:3px double #1d1a14;padding-bottom:4px}
.paper .pdate{font-size:11px;color:#5b4a2b;margin:4px 0 8px;border-bottom:1px solid #1d1a14;padding-bottom:4px}
.paper .head{font-family:Bungee;font-size:20px;line-height:1.15;margin:4px 0 6px}
.paper .sub2{font-size:12px;font-weight:700;letter-spacing:.5px;margin-top:4px}
.big{font-family:Bungee;font-size:34px;color:#b3550a;margin:4px 0 8px;position:relative}
.hof{font-family:Inter;font-size:13px;position:relative;background:#efe5c8;border-radius:8px;padding:8px 12px;margin-bottom:10px}
.hof ol{margin:4px 0 0;padding-left:18px}
.badge{display:inline-block;font-family:Inter;font-size:10px;font-weight:700;letter-spacing:.5px;padding:2px 6px;border-radius:4px;vertical-align:middle;margin-left:4px}
.b-rec{background:#ffcc4d;color:#3a2600}.b-pro{background:#cfe6ff;color:#0b3a6b}.b-one{background:#ffd6d6;color:#8a1015}
.b-ret{background:#ddd;color:#555}.b-cult{background:#ff7ad9;color:#3a0030}.b-new{background:#d4f5e4;color:#0d6b43}
#board{position:fixed;inset:0;background:rgba(5,8,18,.82);display:none;z-index:10;overflow:auto;padding:16px 12px}
#board.open{display:block}
#board .panel{max-width:640px;margin:0 auto;background:var(--card);color:var(--cardink);border-radius:8px;padding:16px 16px 18px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
#board h3{font-family:Bungee;font-weight:400;font-size:15px;color:#b3550a;margin:16px 0 6px;letter-spacing:1px}
#board h2{font-family:Bungee;font-weight:400;font-size:22px;margin:0;color:#1d1a14}
#board table{width:100%;border-collapse:collapse;font-size:13px}
#board th{text-align:left;font-size:11px;color:#7a6a45;border-bottom:2px solid #d7caa3;padding:4px 4px}
#board td{padding:6px 4px;border-bottom:1px solid #e6dcc0;vertical-align:top}
#board td.n{text-align:right;font-variant-numeric:tabular-nums}
#board .empty{font-size:13px;color:#7a6a45;font-style:italic}
#board .close{all:unset;cursor:pointer;float:right;font-family:Inter;font-weight:700;font-size:13px;background:#1d2342;color:var(--ink);padding:6px 12px;border-radius:8px}
#board .rules{font-size:12px;color:#5b4a2b;line-height:1.45;margin:6px 0 0}
.boardbtn{all:unset;cursor:pointer;display:inline-block;margin-top:8px;font-family:Inter;font-size:12px;font-weight:700;color:#2a1a00;background:var(--gold);padding:5px 12px;border-radius:999px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="onair">ON AIR</span>
    <h1 id="showTitle">LATE NIGHT LIVE</h1>
    <div class="sub">Studio 6A, the UBC Tower, Rockefeller-ish Plaza, New York, 1982</div>
    <svg class="skyline" viewBox="0 0 640 46" preserveAspectRatio="none" aria-hidden="true">
      <g fill="#1b2350">
        <rect x="0" y="22" width="40" height="24"/><rect x="44" y="12" width="28" height="34"/><rect x="76" y="26" width="36" height="20"/>
        <rect x="116" y="6" width="22" height="40"/><polygon points="127,0 122,6 132,6"/><rect x="142" y="18" width="44" height="28"/>
        <rect x="190" y="28" width="30" height="18"/><rect x="224" y="10" width="34" height="36"/><rect x="262" y="20" width="26" height="26"/>
        <rect x="292" y="2" width="20" height="44"/><rect x="316" y="16" width="40" height="30"/><rect x="360" y="24" width="30" height="22"/>
        <rect x="394" y="8" width="26" height="38"/><rect x="424" y="20" width="44" height="26"/><rect x="472" y="12" width="24" height="34"/>
        <rect x="500" y="26" width="38" height="20"/><rect x="542" y="14" width="30" height="32"/><rect x="576" y="22" width="64" height="24"/>
      </g>
      <g fill="#ffcc4d" opacity=".7">
        <rect x="50" y="18" width="3" height="3"/><rect x="60" y="28" width="3" height="3"/><rect x="122" y="14" width="3" height="3"/>
        <rect x="230" y="18" width="3" height="3"/><rect x="244" y="30" width="3" height="3"/><rect x="298" y="12" width="3" height="3"/>
        <rect x="400" y="20" width="3" height="3"/><rect x="430" y="28" width="3" height="3"/><rect x="480" y="22" width="3" height="3"/>
        <rect x="550" y="24" width="3" height="3"/>
      </g>
    </svg>
  </header>

  <section class="stats" id="stats" aria-label="Show stats"></section>
  <div id="board" role="dialog" aria-label="Bit Board"><div class="panel" id="boardPanel"></div></div>
  <main id="scene"></main>

  <details class="log"><summary>Production log</summary><ol id="log"></ol></details>
  <div class="foot"><button id="restartBtn">Start over</button></div>
  <div class="copy">&copy; 2026 Necklar. All rights reserved.</div>
</div>

<script src="data.js"></script>
<script src="gen.js"></script>
<script src="game.js"></script>

</body>
</html>
